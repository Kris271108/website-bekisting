<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#2a2a2a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg3)"/>
  <!-- Scaffolding structure -->
  <g stroke="#f3f4f6" stroke-width="5" fill="none">
    <line x1="180" y1="80" x2="180" y2="380"/>
    <line x1="320" y1="80" x2="320" y2="380"/>
    <line x1="460" y1="80" x2="460" y2="380"/>
    <line x1="600" y1="80" x2="600" y2="380"/>
    <line x1="180" y1="130" x2="320" y2="130"/>
    <line x1="320" y1="130" x2="460" y2="130"/>
    <line x1="460" y1="130" x2="600" y2="130"/>
    <line x1="180" y1="230" x2="320" y2="230"/>
    <line x1="320" y1="230" x2="460" y2="230"/>
    <line x1="460" y1="230" x2="600" y2="230"/>
    <line x1="180" y1="330" x2="320" y2="330"/>
    <line x1="320" y1="330" x2="460" y2="330"/>
    <line x1="460" y1="330" x2="600" y2="330"/>
  </g>
  <g stroke="#ef4444" stroke-width="4" fill="none" opacity="0.9">
