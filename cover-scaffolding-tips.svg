    <line x1="460" y1="230" x2="600" y2="330"/>
    <line x1="600" y1="230" x2="460" y2="330"/>
  </g>
  <!-- Safety helmet icon -->
  <g transform="translate(360,150)">
    <path d="M 0 60 A 60 60 0 0 1 120 60 L 120 70 L 0 70 Z" fill="#ef4444"/>
    <rect x="-10" y="65" width="140" height="14" rx="7" fill="#f3f4f6"/>
    <rect x="52" y="0" width="16" height="20" rx="4" fill="#ef4444"/>
  </g>
  <text x="60" y="60" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#ffffff">Keselamatan Scaffolding</text>
  <text x="60" y="88" font-family="Arial, sans-serif" font-size="14" fill="#9a9a9a">Tips Kerja Aman di Ketinggian</text>
