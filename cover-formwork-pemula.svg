<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#2a2a2a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg2)"/>
  <!-- Blueprint grid -->
  <g stroke="#3a3a3a" stroke-width="1">
    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="120" y1="0" x2="120" y2="450"/>
    <line x1="240" y1="0" x2="240" y2="450"/>
    <line x1="360" y1="0" x2="360" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="720" y1="0" x2="720" y2="450"/>
  </g>
  <!-- Ruler/T-square icon -->
  <g transform="translate(420,120)">
    <rect x="0" y="0" width="260" height="26" rx="3" fill="#ef4444"/>
    <rect x="0" y="0" width="26" height="200" rx="3" fill="#ef4444"/>
    <g stroke="#1a1a1a" stroke-width="2">
      <line x1="30" y1="13" x2="30" y2="20" />
      <line x1="60" y1="13" x2="60" y2="20" />
      <line x1="90" y1="13" x2="90" y2="20" />
      <line x1="120" y1="13" x2="120" y2="20" />
      <line x1="150" y1="13" x2="150" y2="20" />
      <line x1="180" y1="13" x2="180" y2="20" />
      <line x1="210" y1="13" x2="210" y2="20" />
      <line x1="240" y1="13" x2="240" y2="20" />
      <line x1="13" y1="30" x2="20" y2="30" />
      <line x1="13" y1="60" x2="20" y2="60" />
      <line x1="13" y1="90" x2="20" y2="90" />
      <line x1="13" y1="120" x2="20" y2="120" />
      <line x1="13" y1="150" x2="20" y2="150" />
      <line x1="13" y1="180" x2="20" y2="180" />
    </g>
  </g>
  <!-- Simple formwork box outline -->
  <rect x="120" y="200" width="180" height="130" rx="4" fill="none" stroke="#f3f4f6" stroke-width="4"/>
  <line x1="120" y1="240" x2="300" y2="240" stroke="#f3f4f6" stroke-width="2" opacity="0.5"/>
  <line x1="120" y1="280" x2="300" y2="280" stroke="#f3f4f6" stroke-width="2" opacity="0.5"/>
  <text x="60" y="60" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#ffffff">Memahami Formwork</text>
  <text x="60" y="88" font-family="Arial, sans-serif" font-size="14" fill="#9a9a9a">Panduan Dasar Pemula</text>
</svg>
