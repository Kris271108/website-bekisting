<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#2a2a2a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg1)"/>
  <!-- Formwork panels -->
  <g stroke="#ef4444" stroke-width="4" fill="none">
    <rect x="120" y="120" width="140" height="220" rx="4"/>
    <rect x="290" y="120" width="140" height="220" rx="4"/>
  </g>
  <g stroke="#f3f4f6" stroke-width="2" fill="none" opacity="0.5">
    <line x1="120" y1="170" x2="260" y2="170"/>
    <line x1="120" y1="220" x2="260" y2="220"/>
    <line x1="120" y1="270" x2="260" y2="270"/>
    <line x1="290" y1="170" x2="430" y2="170"/>
    <line x1="290" y1="220" x2="430" y2="220"/>
    <line x1="290" y1="270" x2="430" y2="270"/>
  </g>
  <!-- Tie rods connecting panels -->
  <line x1="260" y1="160" x2="290" y2="160" stroke="#ef4444" stroke-width="6"/>
  <line x1="260" y1="230" x2="290" y2="230" stroke="#ef4444" stroke-width="6"/>
  <line x1="260" y1="300" x2="290" y2="300" stroke="#ef4444" stroke-width="6"/>
  <circle cx="260" cy="160" r="7" fill="#f3f4f6"/>
  <circle cx="290" cy="160" r="7" fill="#f3f4f6"/>
  <circle cx="260" cy="230" r="7" fill="#f3f4f6"/>
  <circle cx="290" cy="230" r="7" fill="#f3f4f6"/>
  <circle cx="260" cy="300" r="7" fill="#f3f4f6"/>
  <circle cx="290" cy="300" r="7" fill="#f3f4f6"/>
  <!-- second panel pair (varian type) -->
  <g stroke="#f3f4f6" stroke-width="4" fill="none" opacity="0.85">
    <rect x="500" y="150" width="110" height="170" rx="4"/>
    <rect x="630" y="150" width="110" height="170" rx="4"/>
  </g>
  <line x1="610" y1="200" x2="630" y2="200" stroke="#f3f4f6" stroke-width="5" opacity="0.85"/>
  <line x1="610" y1="260" x2="630" y2="260" stroke="#f3f4f6" stroke-width="5" opacity="0.85"/>
  <text x="60" y="60" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#ffffff">Jenis-Jenis Formwork</text>
  <text x="60" y="88" font-family="Arial, sans-serif" font-size="14" fill="#9a9a9a">Bekisting Indonesia</text>
</svg>
