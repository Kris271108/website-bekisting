<html lang="id">
  <head>

    <style>
      .articles-page-wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 140px 24px 80px 24px;
        min-height: 60vh;
      }
      .articles-page-header {
        text-align: center;
        margin-bottom: 40px;
      }
      .articles-page-header h1 {
        font-size: 32px;
        font-weight: 800;
        color: var(--color-dark);
        margin: 0 0 8px 0;
      }
      .articles-page-header p {
        color: #64748b;
        font-size: 14.5px;
        margin: 0;
      }
      .article-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 22px;
      }
      .article-card {
        background: #fff;
        border: 1px solid #eef1f6;
        border-radius: 18px;
        overflow: hidden;
        text-decoration: none;
        color: inherit;
        display: block;
        transition: all 0.2s ease;
        box-shadow: 0 8px 22px -14px rgba(15, 23, 42, 0.16);
      }
      .article-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 14px 30px -14px rgba(15, 23, 42, 0.25);
      }
      .article-card img {
        width: 100%;
        aspect-ratio: 16/9;
        object-fit: cover;
        background: #f1f5f9;
      }
      .article-card-body {
        padding: 16px 18px 20px 18px;
      }
      .article-card-date {
        font-size: 11px;
        color: #94a3b8;
        font-weight: 600;
        margin-bottom: 6px;
      }
      .article-card-title {
        font-size: 16px;
        font-weight: 800;
        color: var(--color-dark);
        margin: 0 0 8px 0;
        line-height: 1.35;
      }
      .article-card-summary {
        font-size: 13px;
        color: #64748b;
        line-height: 1.5;
        margin: 0;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .article-card-source {
        font-size: 11px;
        color: var(--color-accent);
        font-weight: 700;
        margin-top: 10px;
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .articles-empty,
      .articles-loading {
        text-align: center;
        padding: 60px 20px;
        color: #94a3b8;
        font-size: 14px;
      }

      /* ===== Detail artikel ===== */
      .article-detail-back {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #64748b;
        text-decoration: none;
        font-weight: 700;
        font-size: 13px;
        margin-bottom: 24px;
      }
      .article-detail-back:hover {
        color: var(--color-accent);
      }
      .article-detail-cover {
        width: 100%;
        max-height: 420px;
        object-fit: cover;
        border-radius: 20px;
        margin-bottom: 28px;
        background: #f1f5f9;
      }
      .article-detail-date {
        font-size: 12.5px;
        color: #94a3b8;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        margin-bottom: 8px;
      }
      .article-detail-title {
        font-size: 30px;
        font-weight: 800;
        color: var(--color-dark);
        line-height: 1.3;
        margin: 0 0 24px 0;
      }
      .article-detail-content {
        font-size: 15.5px;
        line-height: 1.85;
        color: #334155;
        white-space: pre-line;
        max-width: 760px;
      }
      .article-source-backlink {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        margin-top: 28px;
        padding: 13px 22px;
        background: #fff5f5;
        border: 1px solid #fecaca;
        border-radius: 14px;
        color: var(--color-accent-dark);
        font-weight: 700;
        font-size: 13.5px;
        text-decoration: none;
        max-width: 760px;
      }
      .article-source-backlink:hover {
        background: #fee2e2;
      }

      @media (max-width: 640px) {
        .articles-page-wrap {
          padding: 110px 16px 60px 16px;
        }
        .articles-page-header h1 {
          font-size: 24px;
        }
        .article-detail-title {
          font-size: 22px;
        }
        .article-detail-content {
          font-size: 14.5px;
        }
      }
    </style>
  </head>

            </div>
            <a
              href="admin.html"

              <i class="fa-solid fa-gauge-high"></i> Masuk ke Admin Panel

            <button class="account-logout-btn" id="account-logout-btn" type="button">

    >
      <div
        style="

    <script>
      "use strict";
      const APPS_SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbzep8HXkqiIDlecUEQj8piJCpz1bMH9yxkCLYRXGEkjsRW4U0Jn2q75lbtFKK9W-TY/exec";
      const PLACEHOLDER_IMG =
        "data:image/svg+xml;utf8," +
        encodeURIComponent(
          `<svg xmlns='http://www.w3.org/2000/svg' width='400' height='225'><rect width='400' height='225' fill='%23f1f5f9'/><text x='50%' y='50%' font-size='14' fill='%2394a3b8' text-anchor='middle' dy='.3em'>Bekisting Indonesia</text></svg>`,
        );

      // ===== Menu mobile (hamburger) =====
      const navLinks = document.getElementById("nav-links");
      const hamburgerBtn = document.getElementById("hamburger-btn");
      const navDrawerClose = document.getElementById("nav-drawer-close");
      const navDrawerOverlay = document.getElementById("nav-drawer-overlay");
      function openDrawer() {
        navLinks.classList.add("open");
        navDrawerOverlay.classList.add("open");
      }
      function closeDrawer() {
        navLinks.classList.remove("open");
        navDrawerOverlay.classList.remove("open");
      }
      if (hamburgerBtn) hamburgerBtn.addEventListener("click", openDrawer);
      if (navDrawerClose) navDrawerClose.addEventListener("click", closeDrawer);
      if (navDrawerOverlay) navDrawerOverlay.addEventListener("click", closeDrawer);

      function escapeHtml(v) {
        return String(v === undefined || v === null ? "" : v)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }
      function escapeAttr(v) {
        return String(v === undefined || v === null ? "" : v).replace(
          /"/g,
          "&quot;",
        );
      }
      function formatArticleDate(v) {
        if (!v) return "";
        const d = new Date(v);
        if (isNaN(d.getTime())) return "";
        return d.toLocaleDateString("id-ID", {
          day: "2-digit",
          month: "long",
          year: "numeric",
        });
      }

      const wrap = document.getElementById("articles-page-wrap");

      function renderArticleList(articles) {
        if (articles.length === 0) {
          wrap.innerHTML = `
            <div class="articles-page-header">
              <h1>Artikel</h1>
              <p>Wawasan seputar material bekisting, formwork, dan scaffolding.</p>
            </div>
            <div class="articles-empty">Belum ada artikel yang diterbitkan.</div>
          `;
          return;
        }
        wrap.innerHTML = `
          <div class="articles-page-header">
            <h1>Artikel</h1>
            <p>Wawasan seputar material bekisting, formwork, dan scaffolding.</p>
          </div>
          <div class="article-grid">
            ${articles
              .map(
                (a) => `
                  <a class="article-card" href="artikel.html?slug=${encodeURIComponent(a.Slug || "")}">
                    <img src="${a.CoverImage || PLACEHOLDER_IMG}" alt="${escapeHtml(a.Title)}" onerror="this.src='${PLACEHOLDER_IMG}'" />
                    <div class="article-card-body">
                      <div class="article-card-date">${formatArticleDate(a.UpdatedAt || a.CreatedAt)}</div>
                      <h3 class="article-card-title">${escapeHtml(a.Title)}</h3>
                      <p class="article-card-summary">${escapeHtml(a.Summary)}</p>
                      ${a.SourceName ? `<div class="article-card-source"><i class="fa-solid fa-link"></i> Sumber: ${escapeHtml(a.SourceName)}</div>` : ""}
                    </div>
                  </a>
                `,
              )
              .join("")}
          </div>
        `;
      }

      function renderArticleDetail(article) {
        wrap.innerHTML = `
          <a href="artikel.html" class="article-detail-back">
            <i class="fa-solid fa-arrow-left"></i> Kembali ke Semua Artikel
          </a>
          <img class="article-detail-cover" src="${article.CoverImage || PLACEHOLDER_IMG}" alt="${escapeHtml(article.Title)}" onerror="this.src='${PLACEHOLDER_IMG}'" />
          <div class="article-detail-date">${formatArticleDate(article.UpdatedAt || article.CreatedAt)}</div>
          <h1 class="article-detail-title">${escapeHtml(article.Title)}</h1>
          <div class="article-detail-content">${escapeHtml(article.Content)}</div>
          ${
            article.SourceName && article.SourceUrl
              ? `
                <a class="article-source-backlink" href="${escapeAttr(article.SourceUrl)}" target="_blank" rel="noopener noreferrer">
                  <i class="fa-solid fa-arrow-up-right-from-square"></i>
                  Baca artikel lengkapnya di ${escapeHtml(article.SourceName)}
                </a>
              `
              : ""
          }
        `;
      }

      // Ubah artikel bawaan (articles-data.js) jadi format yang sama dengan
      // baris dari Google Sheets, supaya bisa digabung & ditampilkan bareng.
      function bundledArticlesAsRows() {
        const bundled =
          typeof ARTICLES_DATA !== "undefined" && Array.isArray(ARTICLES_DATA)
            ? ARTICLES_DATA
            : [];
        return bundled.map((a) => ({
          Title: a.title || "",
          Slug: a.slug || "",
          Summary: a.summary || "",
          Content: a.content || "",
          CoverImage: a.coverImage || "",
          Status: "Terbit",
          CreatedAt: "",
          UpdatedAt: "",
          SourceName: a.sourceName || "",
          SourceUrl: a.sourceUrl || "",
        }));
      }

      // Gabungkan: artikel dari Sheets (bisa diedit lewat dashboard, sumber
      // utama) + artikel bawaan yang slug-nya belum ada di Sheets (supaya
      // tetap tampil walau belum pernah disimpan/diimpor ke dashboard).
      function mergeBundledWithSheetArticles(sheetArticles) {
        const bundledRows = bundledArticlesAsRows();
        const sheetSlugs = new Set(
          sheetArticles.map((a) => (a.Slug || "").trim().toLowerCase()),
        );
        const onlyBundled = bundledRows.filter(
          (a) => !sheetSlugs.has((a.Slug || "").trim().toLowerCase()),
        );
        return sheetArticles.concat(onlyBundled);
      }

      async function loadArticlesPage() {
        let articles = bundledArticlesAsRows();
        if (APPS_SCRIPT_URL) {
          try {
            const res = await fetch(`${APPS_SCRIPT_URL}?action=getPublishedArticles`);
            const json = await res.json();
            if (json.ok && Array.isArray(json.data)) {
              articles = mergeBundledWithSheetArticles(json.data);
            }
          } catch (err) {
            console.warn(
              "Tidak bisa memuat artikel dari Dashboard, tetap pakai artikel bawaan.",
              err,
            );
          }
        }
        const params = new URLSearchParams(window.location.search);
        const slug = params.get("slug");
        if (slug) {
          const found = articles.find((a) => a.Slug === slug);
          if (found) {
            renderArticleDetail(found);
          } else {
            wrap.innerHTML = `<div class="articles-empty">Artikel tidak ditemukan. <a href="artikel.html">Kembali ke daftar artikel</a>.</div>`;
          }
        } else {
          renderArticleList(articles);
        }
      }

      loadArticlesPage();
    </script>
  </body>
</html>
